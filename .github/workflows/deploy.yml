name: Build and Push Docker

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug structure
        run: |
          echo "PWD:"
          pwd
          echo "FILES:"
          ls -R

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Find Dockerfile
        id: find_dockerfile
        run: |
          DOCKERFILE_PATH=$(find . -name Dockerfile | grep IngestionService.Api | head -n 1)
          echo "Found Dockerfile at: $DOCKERFILE_PATH"
          echo "dockerfile=$DOCKERFILE_PATH" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: shelow/ingestion-service:latest
          context: .
          file: ${{ steps.find_dockerfile.outputs.dockerfile }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Debug structure (tests)
        run: ls -R
      - name: Run tests
        run: dotnet test
